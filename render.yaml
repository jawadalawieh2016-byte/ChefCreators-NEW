services:
  - type: web
    name: chefcreators-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chefcreators-db
          property: connectionString
      - key: ADMIN_PIN
        value: kafta
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: chefcreators-db
    databaseName: chefcreators
    user: chefcreators
